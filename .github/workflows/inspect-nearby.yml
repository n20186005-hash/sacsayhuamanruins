name: Inspect nearby guide build
on:
  push:
    branches: [qa/nearby-release]
permissions:
  actions: read
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read build result and retrieval evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/154
          for attempt in {1..20}; do
            gh api -X GET repos/$GITHUB_REPOSITORY/actions/runs -f head_sha=0da09ab12adeaf210e85b2ebc105a27c0e99c58f --jq '[.workflow_runs[] | {id,name,status,conclusion,html_url}]' > evidence/154/photo-run.json
            state=$(jq -r '.[0].status' evidence/154/photo-run.json)
            if [ "$state" = completed ]; then break; fi
            sleep 8
          done
          id=$(jq -r '.[0].id // empty' evidence/154/photo-run.json)
          if [ -n "$id" ]; then gh run download "$id" -n nearby-image-evidence -D evidence/154/ || true; gh api repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs --jq '[.jobs[] | {name,conclusion,steps:[.steps[]|{name,conclusion}]}]' > evidence/154/photo-jobs.json; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/154
          if ! git diff --cached --quiet; then git commit -m 'Record image retrieval and build evidence'; git push origin HEAD:qa/nearby-release; fi
