name: Build multilingual nearby guides
on:
  push:
    branches: [guide/nearby-four-languages]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Prepare verified attraction images
        run: |
          python -m pip -q install pillow
          python scripts/prepare-nearby-images.py
      - name: Save image retrieval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nearby-image-evidence
          path: scripts/nearby-image-results.json
      - run: npm run build
      - name: Check generated visitor guides
        run: |
          node scripts/check-nearby.mjs
      - name: Save verified static output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A dist public/sitemap.xml public/nearby-images scripts/nearby-image-results.json src/data/nearby.json
          if ! git diff --cached --quiet; then git commit -m 'Build and verify 124 localized visitor guides'; git push origin HEAD:guide/nearby-four-languages; fi
